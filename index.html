<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moja lista zadań</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <div class="header-top">
        <h1>Lista zadań</h1>
        <button id="theme-toggle" aria-label="Zmień motyw">
          <span class="icon sun">☀️</span>
          <span class="icon moon">🌙</span>
        </button>
      </div>
      <p class="subtitle">Ogarnij dzień. Jeden punkt na raz.</p>
    </header>

    <div class="form">
      <input type="text" id="task-input" placeholder="Co trzeba zrobić?">
      <button id="add-btn">Dodaj</button>
    </div>

    <ul id="task-list"></ul>

    <p id="empty-msg">Brak zadań — zacznij od czegoś małego.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
