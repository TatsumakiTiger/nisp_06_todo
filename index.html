<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moja lista zadań</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <header class="app__header">
      <h1 class="app__title">Lista zadań</h1>

      <button id="theme-toggle" class="app__theme-toggle" aria-label="Zmień motyw">
        <span class="icon sun">☀️</span>
        <span class="icon moon">🌙</span>
      </button>
    </header>

    <p class="app__subtitle">Ogarnij dzień. Jeden punkt na raz.</p>

    <div class="form">
      <input id="task-input" class="form__input" type="text" placeholder="Co trzeba zrobić?" />
      <button id="add-btn" class="form__button">Dodaj</button>
    </div>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-msg" class="app__empty">
      Brak zadań — zacznij od czegoś małego.
    </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
