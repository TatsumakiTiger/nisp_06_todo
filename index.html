<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moja lista zadań</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>📋 Moja lista zadań</h1>
      <p class="subtitle">Ogarnij życie. Jeden punkt na raz.</p>
    </header>

    <div class="form">
      <input type="text" id="task-input" placeholder="Co trzeba zrobić?">
      <button id="add-btn">Dodaj</button>
    </div>

    <ul id="task-list"></ul>

    <p id="empty-msg">Brak zadań — zacznij od czegoś małego.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
